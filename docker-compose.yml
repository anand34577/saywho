# Prebuilt images from ghcr.io; pick one with a profile (docs/DOCKER.md has the details):
#
#   docker compose --profile cpu  up -d     any x86_64 / arm64 machine
#   docker compose --profile cuda up -d     NVIDIA GPU (needs the NVIDIA Container Toolkit)
#   docker compose --profile rknn up -d     Rockchip RK3566/68/76/88 board (set RKNN_ACCEPT_LICENSE=yes in .env)
#
# Or put COMPOSE_PROFILES=cpu|cuda|rknn in .env and run `docker compose up -d`.
# Add --build to build the image from this folder instead of pulling it.
# Settings come from .env (see .env.example); UI and API on http://<host>:${PORT:-7860}.

x-env: &env
  HOST: 0.0.0.0
  PORT: "7860"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_KEY: ${API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ENABLE_UI: ${ENABLE_UI:-true}
  DIAR_BACKEND: ${DIAR_BACKEND:-auto}
  DIAR_FALLBACK: ${DIAR_FALLBACK:-true}
  CPU_THREADS: ${CPU_THREADS:-0}
  CUDA_DEVICE: ${CUDA_DEVICE:-0}
  NPU_CORE_MASK: ${NPU_CORE_MASK:-all}
  RK_PLATFORM: ${RK_PLATFORM:-}
  RKNN_ACCEPT_LICENSE: ${RKNN_ACCEPT_LICENSE:-no}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
  MAX_AUDIO_MINUTES: ${MAX_AUDIO_MINUTES:-0}
  MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-100}
  JOB_TTL_MINUTES: ${JOB_TTL_MINUTES:-60}
  DEFAULT_THRESHOLD: ${DEFAULT_THRESHOLD:-0.5}
  DEFAULT_MIN_SEGMENT: ${DEFAULT_MIN_SEGMENT:-0.1}
  DEFAULT_MERGE_GAP: ${DEFAULT_MERGE_GAP:-0.3}

services:
  cpu:
    profiles: [cpu]
    image: ghcr.io/anand34577/nemotron-diarization:cpu${IMAGE_VERSION:+-$IMAGE_VERSION}
    build: .
    container_name: nemotron-diarization
    ports:
      - "${PORT:-7860}:7860"
    environment: *env
    restart: unless-stopped

  cuda:
    profiles: [cuda]
    image: ghcr.io/anand34577/nemotron-diarization:cuda${IMAGE_VERSION:+-$IMAGE_VERSION}
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu129
    container_name: nemotron-diarization
    ports:
      - "${PORT:-7860}:7860"
    environment: *env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  rknn:
    profiles: [rknn]
    image: ghcr.io/anand34577/nemotron-diarization:rknn${IMAGE_VERSION:+-$IMAGE_VERSION}
    build:
      context: .
      dockerfile: Dockerfile.rknn
    container_name: nemotron-diarization
    # NPU access: /dev/dri (rknpu DRM node) and the device tree (SoC detection)
    privileged: true
    ports:
      - "${PORT:-7860}:7860"
    environment: *env
    volumes:
      - rknn-runtime:/opt/rknn      # Rockchip runtime, downloaded once on first start
    # cpuset: "4-7"                 # optional: pin to the big cores (check with lscpu)
    restart: unless-stopped

volumes:
  rknn-runtime:
