name: docker

# Builds and publishes ghcr.io/<owner>/nemotron-diarization:
#   cpu   linux/amd64 + linux/arm64
#   cuda  linux/amd64 + linux/arm64
#   rknn  linux/arm64
# A version tag (v2.1.0) publishes <variant>, <variant>-2.1.0, <variant>-2.1 and latest (= cpu).
# A manual run publishes <variant>-edge only, for testing.
# Pull requests that touch the images build and smoke-test them but publish no tags.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "requirements*.txt"
      - "docker/**"
      - "scripts/fetch_rknn_runtime.py"
      - "*.py"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.variant }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: cpu,  arch: amd64, file: Dockerfile,      torch: "https://download.pytorch.org/whl/cpu"}
          - {variant: cpu,  arch: arm64, file: Dockerfile,      torch: "https://download.pytorch.org/whl/cpu"}
          - {variant: cuda, arch: amd64, file: Dockerfile,      torch: "https://download.pytorch.org/whl/cu129"}
          - {variant: cuda, arch: arm64, file: Dockerfile,      torch: "https://download.pytorch.org/whl/cu129"}
          - {variant: rknn, arch: arm64, file: Dockerfile.rknn, torch: ""}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (CUDA layers are large)
        if: matrix.variant == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Download the RKNN models from the release
        if: matrix.variant == 'rknn'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download rknn-models-v1 -p '*.rknn' -D rknn_models
          cd rknn_models && sha256sum -c SHA256SUMS

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ matrix.torch && format('TORCH_INDEX={0}', matrix.torch) || '' }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Smoke test (no GPU/NPU here, so this also checks the CPU fallback)
        run: |
          docker buildx prune -af >/dev/null
          docker run -d --name smoke -p 7860:7860 "$IMAGE@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 90); do
            curl -sf localhost:7860/api/v1/ready >/dev/null && break
            sleep 2
          done
          curl -sf localhost:7860/api/v1/info | tee /tmp/info.json; echo
          python3 -c "import wave,random; w=wave.open('/tmp/t.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(bytes(random.getrandbits(8) for _ in range(16000*2*3))); w.close()"
          curl -sf -F file=@/tmp/t.wav localhost:7860/api/v1/diarize | python3 -c "import json,sys; r=json.load(sys.stdin); print('backend', r['backend'], 'duration', r['duration'], 'timings', r['timings']['total'])"
          docker exec smoke ls /licenses
          docker exec smoke python -c "import torch; print('torch', torch.__version__, 'compiled cuda archs:', torch._C._cuda_getArchFlags() if torch.version.cuda else 'none')"
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: publish ${{ matrix.variant }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [cpu, cuda, rknn]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            tags="-t $IMAGE:$VARIANT -t $IMAGE:$VARIANT-$v -t $IMAGE:$VARIANT-${v%.*}"
            [ "$VARIANT" = cpu ] && tags="$tags -t $IMAGE:latest"
          else
            tags="-t $IMAGE:$VARIANT-edge"
          fi
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
          first=$(echo $tags | awk '{print $2}')
          docker buildx imagetools inspect "$first"
