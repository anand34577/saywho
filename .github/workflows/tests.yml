name: tests

on:
  push:
  pull_request:

jobs:
  api:
    # API and segmentation tests with a fake model: no PyTorch, GPU or model download needed
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install fastapi uvicorn python-multipart numpy soundfile httpx imageio-ffmpeg
      - run: python -m unittest discover -s tests -v

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n install.sh && bash -n run.sh && bash -n scripts/check_npu.sh
      # one profile at a time, as used (the services share a container name on purpose)
      - run: for p in cpu gpu npu; do docker compose --profile $p config --quiet; done
